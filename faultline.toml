# Runtime settings. Model name and URL live here, never in code.

[llm]
# OpenAI-compatible local endpoint. Ollama serves one on port 11434.
base_url = "http://localhost:11434/v1"
model = "qwen2.5:7b-instruct"
temperature = 0.0
seed = 0
timeout_s = 600

[warehouse]
adapter = "duckdb"

[monitors]
# A value is unusual when it leaves the range of the reference runs, widened by
# a margin. Tuned on dev only. See docs/EVAL.md.
volume_rel_margin = 0.01
volume_abs_margin = 1
null_abs_margin = 0.02
dist_rel_margin = 0.10
dist_mad_k = 6.0
dist_abs_margin = 1e-9
dist_spread_k = 1.0
freshness_min_lag_hours = 1.0
min_reference_runs = 3

# Profiles for the M6 runs on a Mac: an MLX server (mlx_lm.server, port 8080)
# serving Qwen2.5-7B-Instruct in 4 bit, without an adapter or with one trained
# on benchmark/train/ only. Start the server with the matching --adapter-path;
# see docs/EVAL.md. "default_model" means the model the server was started with.
[llm.profiles.mlx_base]
base_url = "http://localhost:8080/v1"
model = "default_model"
served_model = "mlx-community/Qwen2.5-7B-Instruct-4bit"

[llm.profiles.mlx_ranker]
base_url = "http://localhost:8080/v1"
model = "default_model"
served_model = "mlx-community/Qwen2.5-7B-Instruct-4bit"
adapter = "build/adapters/ranker"

[llm.profiles.mlx_raw_log]
base_url = "http://localhost:8080/v1"
model = "default_model"
served_model = "mlx-community/Qwen2.5-7B-Instruct-4bit"
adapter = "build/adapters/raw_log"

# The hosted reference line (CLAUDE.md principle 7). Benchmark data only.
# The key is read from the environment variable named here and never stored.
[reference]
provider = "anthropic"
model = "claude-opus-5-5"
api_key_env = "ANTHROPIC_API_KEY"
input_usd_per_mtok = 4.0
output_usd_per_mtok = 20.0
prices_source = "https://platform.claude.com/docs/en/about-claude/pricing"
prices_checked = "2026-11-20"
cap_usd = 5.00
max_tokens = 1024
# No temperature: the API answers 400 "temperature is deprecated for this model"
# for Opus 5.5 (2026-11-22), so the model's default sampling is used.
timeout_s = 300
dry_run_output_tokens = 300
