# LoRA adapter for the triage re-ranking slot. Run on a Mac: make finetune-ranker
# Data comes from `faultline finetune export --slot ranker` (train split only).
model: "mlx-community/Qwen2.5-7B-Instruct-4bit"
train: true
data: "build/finetune/ranker"
adapter_path: "build/adapters/ranker"
fine_tune_type: lora
mask_prompt: true          # learn the answer only, not the prompt
seed: 0
num_layers: 16
batch_size: 1
grad_accumulation_steps: 4
iters: 330                 # about 2 passes over 166 examples
learning_rate: 1.0e-5
max_seq_length: 6144       # longest prompt about 15.5k characters
grad_checkpoint: true
steps_per_report: 10
steps_per_eval: 50
val_batches: -1
save_every: 50
lora_parameters:
  rank: 8
  dropout: 0.0
  scale: 20.0
